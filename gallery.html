    /* ── Gallery Pulita ────────────────────────────── */
    .pg-section {
      padding: 32px 16px 60px;
      background: var(--bg-main, #f8f6f1);
      min-height: 60vh;
    }
    .pg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .pg-item {
      overflow: hidden;
      border-radius: 6px;
      cursor: pointer;
      aspect-ratio: 4/3;
      background: #ddd;
    }
    .pg-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .pg-item:hover img { transform: scale(1.04); }

    /* ── Lightbox ──────────────────────────────────── */
    .pg-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .pg-lightbox.open { display: flex; }
    .pg-lb-img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
      user-select: none;
    }
    .pg-lb-close {
      position: fixed;
      top: 18px; right: 24px;
      background: none; border: none;
      color: #fff; font-size: 2.4rem;
      cursor: pointer; line-height: 1;
      z-index: 10000;
    }
    .pg-lb-prev, .pg-lb-next {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      border: none; color: #fff;
      font-size: 1.8rem; padding: 12px 18px;
      cursor: pointer; border-radius: 4px;
      z-index: 10000;
    }
    .pg-lb-prev { left: 12px; }
    .pg-lb-next { right: 12px; }
    .pg-lb-prev:hover, .pg-lb-next:hover { background: rgba(255,255,255,0.25); }

    @media (max-width: 600px) {
      .pg-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .pg-lb-prev { left: 4px; }
      .pg-lb-next { right: 4px; }
    }
  </style>

  <!-- Script Core dell'Applicazione -->
  <script src="js/app.js"></script>

  <script>
    const pgPhotos = [
      'assets/img/gallery/MAV00044.JPG',
      'assets/img/gallery/dji_fly_20260912_091224_0028_1789234776990_photo_beautify.jpg',
      'assets/img/gallery/dji_fly_20260920_085748_0152_1789965475783_video_trim(1).jpg',
      'assets/img/gallery/IMG-20260915-WA0013.jpg',
      'assets/img/gallery/IMG-20260915-WA0014.jpg',
      'assets/img/gallery/IMG-20260920-WA0027.jpg',
    ];
    let pgIdx = 0;
    const lb = document.getElementById('pgLightbox');
    const lbImg = document.getElementById('pgLbImg');

    function openLB(i) {
      pgIdx = i;
      lbImg.src = pgPhotos[pgIdx];
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLB() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }
    function closeLBOnBg(e) { if (e.target === lb) closeLB(); }
    function moveLB(dir) {
      pgIdx = (pgIdx + dir + pgPhotos.length) % pgPhotos.length;
      lbImg.src = pgPhotos[pgIdx];
    }
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLB();
      if (e.key === 'ArrowRight') moveLB(1);
      if (e.key === 'ArrowLeft') moveLB(-1);
    });
  </script>
